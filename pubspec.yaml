name: graduation_project
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'
dependencies:
  animated_custom_dropdown: ^3.1.1
  cached_network_image: ^3.4.0
  cupertino_icons: ^1.0.6
  curved_navigation_bar: ^1.0.6
  dartz: ^0.10.1
  device_preview: ^1.1.0
  dio: ^5.8.0+1
  dots_indicator: ^4.0.1
  intl : ^0.18.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.8
  get_it: ^7.2.0
  image_picker: ^1.1.2
  injectable: ^2.4.2
  injectable_generator: ^2.6.1
  loading_indicator: ^3.1.1
  shared_preferences: ^2.2.3
  pin_code_fields: ^8.0.1
  flutter_native_splash: ^2.4.0
  flutter_localization: ^0.2.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  flutter_charts: ^0.5.2


  
  # pin_code_fields: ^8.0.1
dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/font/
    - assets/svg_images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/font/static/Cairo-Black.ttf
        - asset: assets/font/static/Cairo-Bold.ttf
        - asset: assets/font/static/Cairo-ExtraBold.ttf
        - asset: assets/font/static/Cairo-ExtraLight.ttf
        - asset: assets/font/static/Cairo-Light.ttf
        - asset: assets/font/static/Cairo-Medium.ttf
        - asset: assets/font/static/Cairo-Regular.ttf
        - asset: assets/font/static/Cairo-SemiBold.ttf
        - asset: assets/font/Cairo-VariableFont_slnt,wght.ttf
        # - asset: assets/font/Cairo/Cairo-VariableFont_slnt,wght.ttf
        # - asset: assets/font/Cairo/static/Cairo-ExtraBold.ttf
        # - asset: assets/font/Cairo/Cairo-VariableFont_slnt,wght.ttf
        # - asset: assets/font/Cairo/static/Cairo-ExtraLight.ttf
        # - asset: assets/font/Cairo/static/Cairo-Light.ttf
        # - asset: assets/font/Cairo/static/Cairo-Medium.ttf
        # - asset: assets/font/Cairo/static/Cairo-Regular.ttf
        # - asset: assets/font/Cairo/static/Cairo-SemiBold.ttf
  #       # - asset: fonts/Schyler-Italic.ttf
  #         style: italic
    - family: Tajawal
      fonts:
        - asset: assets/font/Cairo,Tajawal/Tajawal/Tajawal-Bold.ttf
        - asset: assets/font/Cairo,Tajawal/Tajawal/Tajawal-ExtraBold.ttf 
          # weight: 700
